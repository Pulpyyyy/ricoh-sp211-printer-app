# Builds the Debian 13 packages (amd64 and arm64) on every push and pull
# request; on a version tag (v1.2.3) also attaches them to a GitHub release.
name: Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config libpappl-dev libusb-1.0-0-dev libmosquitto-dev python3 dpkg-dev             ca-certificates git

      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0~git$(date -u +%Y%m%d%H%M).${GITHUB_SHA%"${GITHUB_SHA#???????}"}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test the package
        run: sh packaging/build-deb.sh "${{ steps.version.outputs.version }}"

      - name: Show the package
        run: |
          dpkg-deb -I build/*.deb
          dpkg-deb -c build/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: sp211-printer-app-${{ matrix.arch }}
          path: build/*.deb
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
              --notes "Debian 13 (trixie) packages for amd64 and arm64."
          gh release upload "$GITHUB_REF_NAME" dist/*.deb --repo "$GITHUB_REPOSITORY" --clobber
