# SPDX-License-Identifier: GPL-2.0-or-later
blueprint:
  name: SP 211 – prise de l'imprimante
  description: >-
    Relie une prise connectée à l'imprimante Ricoh SP 211 publiée par
    sp211-printer-app (MQTT). L'application décide quand l'imprimante doit
    être allumée : à l'arrivée d'un document, et éteinte après le délai
    d'inactivité choisi (réglages « Auto power on », « Auto power off » et
    « Power-off delay » de l'appareil, ou dans la carte). Cette automatisation
    applique ses demandes à la prise et, dans l'autre sens, lui signale quand
    la prise est allumée ou éteinte autrement (à la main, par une autre
    automatisation). N'importe quelle prise de type interrupteur convient.
  domain: automation
  source_url: https://github.com/Pulpyyyy/ricoh-sp211-printer-app/blob/main/homeassistant/blueprints/sp211_power.yaml
  input:
    printer_power:
      name: Imprimante
      description: L'interrupteur « Power » de l'appareil SP 211 (intégration MQTT).
      selector:
        entity:
          filter:
            - domain: switch
              integration: mqtt
    plug:
      name: Prise
      description: La prise sur laquelle l'imprimante est branchée.
      selector:
        entity:
          filter:
            - domain: switch

mode: queued
max: 10

triggers:
  # The application asks for the printer to be switched on or off.
  - trigger: state
    entity_id: !input printer_power
    from: ["on", "off"]
    to: ["on", "off"]
    id: app
  # The application (re)started, or Home Assistant did: tell it the plug's state.
  - trigger: state
    entity_id: !input printer_power
    from: ["unavailable", "unknown"]
    to: ["on", "off"]
    id: sync
  - trigger: homeassistant
    event: start
    id: sync
  # The plug changed by other means.
  - trigger: state
    entity_id: !input plug
    to: ["on", "off"]
    id: sync

variables:
  printer_power: !input printer_power
  plug: !input plug

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: app
          - condition: template
            value_template: >-
              {{ states(plug) in ['on', 'off'] and states(plug) != states(printer_power) }}
        sequence:
          - action: "switch.turn_{{ states(printer_power) }}"
            target:
              entity_id: !input plug
      - conditions:
          - condition: trigger
            id: sync
          - condition: template
            value_template: >-
              {{ states(plug) in ['on', 'off'] and states(printer_power) in ['on', 'off'] }}
        sequence:
          # Sent even when both already agree: it tells the application that
          # a plug follows its switch.
          - action: "switch.turn_{{ states(plug) }}"
            target:
              entity_id: !input printer_power
