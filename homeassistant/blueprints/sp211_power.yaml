# SPDX-License-Identifier: GPL-2.0-or-later
blueprint:
  name: SP 211 – printer plug
  description: >-
    Links a smart plug to the Ricoh SP 211 published by sp211-printer-app
    (MQTT). The printer application decides when the printer must be on: when
    a document arrives, and off after the chosen idle delay (settings "Auto
    power on", "Auto power off" and "Power-off delay" of the device, or in
    the card). This automation applies its requests to the plug and, the
    other way round, tells it when the plug is switched on or off by other
    means (by hand, by another automation). Any plug shown as a switch works.
  domain: automation
  source_url: https://github.com/Pulpyyyy/ricoh-sp211-printer-app/blob/main/homeassistant/blueprints/sp211_power.yaml
  input:
    printer_power:
      name: Printer
      description: The "Power" switch of the SP 211 device (MQTT integration).
      selector:
        entity:
          filter:
            - domain: switch
              integration: mqtt
    plug:
      name: Plug
      description: The plug the printer is plugged into.
      selector:
        entity:
          filter:
            - domain: switch

mode: queued
max: 10

triggers:
  # The application asks for the printer to be switched on or off.
  - trigger: state
    entity_id: !input printer_power
    from: ["on", "off"]
    to: ["on", "off"]
    id: app
  # The application (re)started, or Home Assistant did: tell it the plug's state.
  - trigger: state
    entity_id: !input printer_power
    from: ["unavailable", "unknown"]
    to: ["on", "off"]
    id: sync
  - trigger: homeassistant
    event: start
    id: sync
  # The plug changed by other means.
  - trigger: state
    entity_id: !input plug
    to: ["on", "off"]
    id: sync

variables:
  printer_power: !input printer_power
  plug: !input plug

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: app
          - condition: template
            value_template: >-
              {{ states(plug) in ['on', 'off'] and states(plug) != states(printer_power) }}
        sequence:
          - action: "switch.turn_{{ states(printer_power) }}"
            target:
              entity_id: !input plug
      - conditions:
          - condition: trigger
            id: sync
          - condition: template
            value_template: >-
              {{ states(plug) in ['on', 'off'] and states(printer_power) in ['on', 'off'] }}
        sequence:
          # Sent even when both already agree: it tells the application that
          # a plug follows its switch.
          - action: "switch.turn_{{ states(plug) }}"
            target:
              entity_id: !input printer_power
